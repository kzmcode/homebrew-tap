name: check

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks files and never needs to write.
permissions:
  contents: read

jobs:
  style-and-audit:
    runs-on: macos-latest
    env:
      # brew audit --online calls the GitHub API; unauthenticated runners share a 60 req/h limit.
      # The built-in token is read-only (see permissions above).
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/kzmcode"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/kzmcode/homebrew-tap"
      - name: brew style
        run: brew style kzmcode/tap
      - name: brew audit (casks)
        run: |
          for f in Casks/*.rb; do
            [ -e "$f" ] || continue
            brew audit --cask --online "kzmcode/tap/$(basename "$f" .rb)"
          done
      - name: brew audit (formulae)
        run: |
          for f in Formula/*.rb; do
            [ -e "$f" ] || continue
            brew audit --formula --online "kzmcode/tap/$(basename "$f" .rb)"
          done
